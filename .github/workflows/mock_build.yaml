name: Mock Build

permissions:
  contents: read

on:
  pull_request:

jobs:
  mock_build:
    name: Run Mock Build
    runs-on: ubuntu-24.04

    env:
      MOCK_BUILD: 'true'
      ENVIRONMENT: demo
      TENANTS_CONFIG: '{"send":{"baseUrl":"mock","token":"mock","feedbackToken":"mock"},"appio":{"baseUrl":"mock","token":"mock","feedbackToken":"mock"},"demo":{"baseUrl":"mock","token":"mock","feedbackToken":"mock"},"interop":{"baseUrl":"mock","token":"mock","feedbackToken":"mock"},"pagopa":{"baseUrl":"mock","token":"mock","feedbackToken":"mock"},"wallet":{"baseUrl":"mock","token":"mock","feedbackToken":"mock"}}'
      CDN_PATH: mock

    steps:
      - name: Checkout code
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0

      - name: Setup Node.JS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Compile packages
        shell: bash
        run: npm run compile
        working-directory: apps/nextjs-website

      - name: Run Mock Build
        shell: bash
        run: npm run build
        working-directory: apps/nextjs-website
